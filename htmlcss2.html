<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background-color: #4CAF50; color: white; padding: 15px; font-size: 24px; }
        section { width: 80%; margin: auto; padding: 20px; }
        table { width: 60%; margin: auto; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; }
        th { background-color: #f4b400; color: white; }
        footer { padding: 10px; background-color: #333; color: white; margin-top: 20px; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 10px; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>Poonam Waghode</h1>
        <p><em>Web Developer & Designer</em></p>
    </header>

    <section>
        <h2>About Me</h2>
        <p>Hello! I am passionate about web development, specializing in HTML, CSS, and JavaScript.</p>
    </section>

    <section>
        <h2>Skills</h2>
        <table>
            <tr>
                <th>Skill</th>
                <th>Proficiency</th>
            </tr>
            <tr>
                <td>HTML & CSS</td>
                <td>Advanced</td>
            </tr>
            <tr>
                <td>JavaScript</td>
                <td>Intermediate</td>
            </tr>
        </table>
    </section>

    <section>
        <h2>Contact Me</h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" required><br><br>

            <label for="message">Message:</label>
            <textarea id="message" rows="4"></textarea><br><br>

            <button type="submit">Send</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Your Name | <a href="mailto:yourname@example.com">Email Me</a></p>
    </footer>

</body>
</html>
